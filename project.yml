name: Nightshift

options:
  bundleIdPrefix: com.FlyMedia
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: BJZSH247Q9
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0.0"
    SWIFT_VERSION: "5.0"

targets:
  Nightshift:
    type: application
    platform: macOS
    sources:
      - path: Nightshift
        excludes:
          - Info.plist
          - Nightshift.entitlements
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Nightshift/Nightshift.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_FILE: Nightshift/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.FlyMedia.Nightshift
    dependencies:
      - target: Nightshift Extension
        embed: true

  Nightshift Extension:
    type: app-extension
    platform: macOS
    sources:
      - path: Nightshift Extension
        excludes:
          - Info.plist
          - Nightshift_Extension.entitlements
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Nightshift Extension/Nightshift_Extension.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Nightshift Extension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.FlyMedia.Nightshift.Extension
        SKIP_INSTALL: YES

schemes:
  Nightshift:
    build:
      targets:
        Nightshift: all
    run:
      config: Debug


name: Nightshift

options:
  bundleIdPrefix: com.FlyMedia
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "12.3"

settings:
  base:
    CURRENT_PROJECT_VERSION: "16"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    DEVELOPMENT_TEAM: BJZSH247Q9
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "12.3"
    MARKETING_VERSION: "1.0.7"
    OTHER_CODE_SIGN_FLAGS: --timestamp
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  Nightshift:
    type: application
    platform: macOS
    sources:
      - path: Nightshift
        excludes:
          - Info.plist
          - Nightshift.entitlements
          - Nightshift.icns
          - PrivacyInfo.xcprivacy
      - path: Nightshift/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Icon/Nightshift Icon.icon
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "Nightshift Icon"
        CODE_SIGN_ENTITLEMENTS: Nightshift/Nightshift.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_FILE: Nightshift/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.FlyMedia.Nightshift
    dependencies:
      - target: Nightshift Extension
        embed: true

  Nightshift Extension:
    type: app-extension
    platform: macOS
    sources:
      - path: Nightshift Extension/SafariWebExtensionHandler.swift
      - path: Nightshift Extension/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Nightshift Extension/Resources/manifest.json
        buildPhase: resources
      - path: Nightshift Extension/Resources/theme-policy.js
        buildPhase: resources
      - path: Nightshift Extension/Resources/settings-store.js
        buildPhase: resources
      - path: Nightshift Extension/Resources/manual-dark-sites.js
        buildPhase: resources
      - path: Nightshift Extension/Resources/known-dark-sites.js
        buildPhase: resources
      - path: Nightshift Extension/Resources/background.js
        buildPhase: resources
      - path: Nightshift Extension/Resources/content.js
        buildPhase: resources
      - path: Nightshift Extension/Resources/nightshift.css
        buildPhase: resources
      - path: Nightshift Extension/Resources/popup.html
        buildPhase: resources
      - path: Nightshift Extension/Resources/popup.css
        buildPhase: resources
      - path: Nightshift Extension/Resources/popup.js
        buildPhase: resources
      - path: Nightshift Extension/Resources/options.html
        buildPhase: resources
      - path: Nightshift Extension/Resources/options.css
        buildPhase: resources
      - path: Nightshift Extension/Resources/options.js
        buildPhase: resources
      - path: Nightshift Extension/Resources/icon-48.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/icon-64.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/icon-96.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/icon-128.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/icon-256.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/icon-512.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/toolbar-16.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/toolbar-19.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/toolbar-32.png
        buildPhase: resources
      - path: Nightshift Extension/Resources/toolbar-38.png
        buildPhase: resources
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Nightshift Extension/Nightshift_Extension.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        INFOPLIST_FILE: Nightshift Extension/Info.plist
        OTHER_LDFLAGS: -framework SafariServices
        PRODUCT_BUNDLE_IDENTIFIER: com.FlyMedia.Nightshift.Extension
        SKIP_INSTALL: YES

schemes:
  Nightshift:
    build:
      targets:
        Nightshift: all
    run:
      config: Debug
